plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.classifier_app"
    // tflite_flutter requires Android SDK 36
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // ultralytics_yolo requires Java 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.classifier_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Required for tflite_v2 - don't compress .tflite files
    aaptOptions {
        noCompress 'tflite'
        noCompress 'lite'
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            
            // ProGuard/R8 rules for ultralytics_yolo and dependencies
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Enable minification
            minifyEnabled true
            shrinkResources true
        }
    }
}

dependencies {
    // Note: tflite_flutter 0.12.1 uses litert (com.google.ai.edge.litert:litert:1.4.0)
    // which is Google's optimized TensorFlow Lite runtime.
    // 
    // If your model requires Select TF Ops (Flex ops), you may need to:
    // 1. Re-convert your model to use only TFLite built-in ops, OR
    // 2. Use a different tflite_flutter version that supports Select TF Ops
    //
    // For now, we're not adding Select TF Ops to avoid conflicts with litert.
    // If you still get "failed precondition" errors, try re-converting your model.
}

flutter {
    source = "../.."
}
