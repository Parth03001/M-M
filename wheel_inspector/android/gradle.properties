org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Java Configuration - REQUIRED FOR BUILD TO WORK
# You MUST uncomment and set this to your Java 17 installation path
# Use double backslashes (\\) in the path
# Common locations:
# org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.17.10-hotspot
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17
org.gradle.java.home=

# Enable Java toolchain auto-detection (auto-download disabled to avoid SSL issues)
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
