name: wheel_cap_inspector
description: "App for rear and front wheel cap inspection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ML & Image Processing
  tflite_flutter: ^0.11.0
  image: ^4.1.7

  # Camera & Scanning
  camera: ^0.11.0+2
  mobile_scanner: ^5.2.3

  # File system & Persistence
  path_provider: ^2.1.2
  drift: ^2.30.0
  drift_flutter: ^0.2.8

  # UI & Design
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
    - assets/labels.txt
